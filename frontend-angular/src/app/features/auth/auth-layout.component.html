<main class="auth-page">
  <div class="auth-brand-panel">
    <a class="brand" routerLink="/" aria-label="Pendura Aí - início">
      <img class="brand-logo" src="/Logo_completa.png" alt="Pendura Aí" />
    </a>

    <div class="brand-message">
      <h1>Mais clareza para cuidar do seu negócio.</h1>
      <p>Registre, acompanhe e resolva suas pendências de um jeito simples.</p>
    </div>
  </div>

  <section class="auth-content" aria-labelledby="auth-title">
    <div class="auth-card">
      <div class="auth-heading">
        <span class="eyebrow">Pendura Aí</span>
        <h2 id="auth-title">{{ title() }}</h2>
        <p>{{ description() }}</p>
      </div>

      <ng-content />

      <p class="auth-alternate">
        {{ alternateText() }}
        <a [routerLink]="alternateLink()">{{ alternateLabel() }}</a>
      </p>
    </div>
  </section>
</main>
