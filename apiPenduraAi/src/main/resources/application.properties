spring.application.name=apiPenduraAi

server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/api_pendura_ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
